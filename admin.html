<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d6a86">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="robots" content="noindex">
  <title>Admin · Crockery Stock</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="updateBar" class="update-bar" role="status" hidden>
  <span>A new version of the app is ready.</span>
  <button id="updateBtn" class="btn primary sm" type="button">Update now</button>
</div>

<div class="app admin-wrap">
  <header class="top">
    <div class="brand">
      <a href="/" class="back">← Back to stock</a>
      <h1>Admin</h1>
      <span class="hint" id="whoAdmin"></span>
    </div>
    <div class="top-actions">
      <button class="btn ghost" type="button" id="refreshUsers" title="Reload list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span class="lbl">Reload</span></button>
      <button class="btn primary" type="button" id="addUser" disabled><span aria-hidden="true">＋</span>Add user</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="tabs admin-tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-atab="users">Users</button>
    <button type="button" role="tab" aria-selected="false" data-atab="lists">Lists &amp; settings</button>
  </div>

  <section id="listsPane" class="pane" hidden>
    <p class="hint">These lists fill the dropdowns when staff add items and record stock. Changes save straight away and appear on every device.</p>
    <div id="listsBox" class="lists-grid"><div class="empty"><h3>Loading lists…</h3></div></div>
  </section>

  <section id="usersPane" class="pane">
  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="uq" type="search" placeholder="Search by name or email" aria-label="Search users">
    </div>
  </div>
  <p class="hint"><b>Staff</b> can update stock. <b>Admins</b> can also add and remove users.</p>
  <ul class="ulist" id="ulist"><li style="display:block"><div class="empty"><h3>Loading users…</h3></div></li></ul>
  </section>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" id="panel"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="/admin.js"></script>
</body>
</html>
